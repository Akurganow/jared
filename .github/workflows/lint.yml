name: Lint
on:
  push:
    branches: [ master ]
  pull_request:
jobs:
  biome:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      TARGET_BROWSER: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run Biome
        run: npm run lint
  typecheck:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      TARGET_BROWSER: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tsc
        run: npx tsc --noEmit
